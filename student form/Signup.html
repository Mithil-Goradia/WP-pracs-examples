<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="mainbox">
    <p>Student Sign Up</p>

    <form id="signupForm">

        <input placeholder="Enter name" id="name"/>
        <small id="nameerr"></small>

        <input placeholder="Enter email" id="email"/>
        <small id="emailerr"></small>

        <input placeholder="Enter Contact no." id="contact"/>
        <small id="numerr"></small>

        <input placeholder="Enter password" id="pwd" type="password"/>
        <small id="pwderr"></small>

        <input placeholder="Confirm password" id="cpwd" type="password"/>
        <small id="cpwderr"></small>

        <button type="submit">Sign-up</button>
    </form>

    <a href="Login.html">Log-in</a>
</div>

<script src="script.js"></script>
</body>
</html>
